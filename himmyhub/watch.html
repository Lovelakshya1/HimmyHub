<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniKoto Watch - ID Resolver (V2)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1410 100%);
            color: #e8dcc8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #b8860b;
            padding-bottom: 20px;
        }

        h1 {
            font-size: 2.5em;
            color: #ffd700;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #a0826d;
            font-size: 0.9em;
            font-style: italic;
        }

        .input-section {
            background: rgba(30, 20, 15, 0.8);
            border: 2px solid #b8860b;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 40px;
            backdrop-filter: blur(10px);
        }

        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        label {
            color: #ffd700;
            font-weight: 600;
            min-width: 100px;
        }

        input {
            padding: 12px 16px;
            background: rgba(10, 10, 10, 0.9);
            border: 2px solid #8b6914;
            border-radius: 4px;
            color: #e8dcc8;
            font-size: 1em;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 200px;
        }

        input:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #b8860b, #ffd700);
            color: #1a1410;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            padding: 12px 16px;
            border-radius: 4px;
            margin-top: 15px;
            font-size: 0.95em;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.loading {
            background: rgba(184, 134, 11, 0.2);
            color: #ffd700;
            border-left: 4px solid #ffd700;
        }

        .status.success {
            background: rgba(34, 139, 34, 0.2);
            color: #90ee90;
            border-left: 4px solid #90ee90;
        }

        .status.error {
            background: rgba(220, 20, 60, 0.2);
            color: #ff6b6b;
            border-left: 4px solid #ff6b6b;
        }

        .id-display {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .id-card {
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid #8b6914;
            border-radius: 4px;
            padding: 15px;
            text-align: center;
        }

        .id-card-label {
            color: #a0826d;
            font-size: 0.85em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .id-card-value {
            color: #ffd700;
            font-size: 1.6em;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }

        .players-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .player-container {
            background: rgba(30, 20, 15, 0.9);
            border: 2px solid #b8860b;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .player-container:hover {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
        }

        .player-header {
            background: linear-gradient(90deg, #1a1410, #2a1f15);
            border-bottom: 2px solid #b8860b;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-name {
            color: #ffd700;
            font-weight: 600;
            font-size: 1.1em;
        }

        .player-badge {
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 600;
            text-transform: uppercase;
        }

        .player-frame {
            width: 100%;
            height: 500px;
            background: #000;
            border: none;
        }

        .player-url {
            padding: 15px;
            background: rgba(10, 10, 10, 0.8);
            border-top: 1px solid #8b6914;
        }

        .url-label {
            color: #a0826d;
            font-size: 0.8em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .url-text {
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #8b6914;
            padding: 10px 12px;
            border-radius: 4px;
            color: #e8dcc8;
            font-size: 0.75em;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            overflow-x: auto;
        }

        .copy-btn {
            padding: 8px 16px;
            background: rgba(184, 134, 11, 0.3);
            color: #ffd700;
            border: 1px solid #b8860b;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: rgba(184, 134, 11, 0.5);
        }

        .disabled-state {
            opacity: 0.5;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .input-group {
                flex-direction: column;
            }

            label {
                min-width: unset;
            }

            .players-section {
                grid-template-columns: 1fr;
            }

            .player-frame {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 AniKoto Watch</h1>
            <p class="subtitle">MAL ID / Title → AniKoto Internal ID Resolver (V2)</p>
        </header>

        <div class="input-section">
            <div class="input-group">
                <label for="malIdOrTitle">Search by:</label>
                <input 
                    type="text" 
                    id="malIdOrTitle" 
                    placeholder="MAL ID (21) or Anime Title (Demon Slayer)"
                >
                <button id="resolveBtn" onclick="resolve()">Search & Resolve</button>
            </div>
            <div class="status" id="status"></div>
            <div class="id-display" id="idDisplay"></div>
        </div>

        <div class="players-section" id="playersSection" style="display: none;">
            <!-- Players will be populated here -->
        </div>
    </div>

    <script>
        const KITSU_BASE = 'https://kitsu.app/api/edge';
        let resolvedIds = {
            mal: null,
            anikoto: null,
            kitsu: null,
            title: null
        };

        function showStatus(message, type = 'loading') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status show ${type}`;
        }

        function hideStatus() {
            document.getElementById('status').classList.remove('show');
        }

        function isNumeric(str) {
            return /^\d+$/.test(str);
        }

        async function resolve() {
            const input = document.getElementById('malIdOrTitle').value.trim();
            
            if (!input) {
                showStatus('❌ Please enter MAL ID or anime title', 'error');
                return;
            }

            const btn = document.getElementById('resolveBtn');
            btn.disabled = true;

            if (isNumeric(input)) {
                await resolveByMalId(Number(input));
            } else {
                await resolveByTitle(input);
            }

            btn.disabled = false;
        }

        async function resolveByMalId(malId) {
            showStatus('🔍 Looking up MAL ID ' + malId + ' via Kitsu...', 'loading');

            try {
                const response = await fetch(
                    `${KITSU_BASE}/mappings?filter[externalSite]=myanimelist/anime&filter[externalId]=${malId}&include=item`,
                    { headers: { 'Accept': 'application/vnd.api+json' } }
                );

                if (!response.ok) {
                    throw new Error(`API returned ${response.status}`);
                }

                const data = await response.json();

                if (!data.data || data.data.length === 0) {
                    throw new Error('No mapping found. Try searching by title instead.');
                }

                let animeData;
                
                // Check if anime is in included
                const animeItem = data.included?.find(i => i.type === 'anime');
                
                if (animeItem) {
                    animeData = animeItem;
                } else {
                    // Fetch anime separately using relationship ID
                    const kitsuId = data.data[0].relationships?.item?.data?.id;
                    if (!kitsuId) throw new Error('Could not extract Kitsu ID');

                    showStatus('📡 Fetching anime details...', 'loading');
                    
                    const animeResponse = await fetch(
                        `${KITSU_BASE}/anime/${kitsuId}`,
                        { headers: { 'Accept': 'application/vnd.api+json' } }
                    );

                    if (!animeResponse.ok) throw new Error('Failed to fetch anime');
                    const animeDataResponse = await animeResponse.json();
                    animeData = animeDataResponse.data;
                }

                populateIds(malId, animeData);
            } catch (error) {
                showStatus(`❌ ${error.message}`, 'error');
            }
        }

        async function resolveByTitle(title) {
            showStatus('🔍 Searching Kitsu for "' + title + '"...', 'loading');

            try {
                const response = await fetch(
                    `${KITSU_BASE}/anime?filter[text]=${encodeURIComponent(title)}&page[limit]=1`,
                    { headers: { 'Accept': 'application/vnd.api+json' } }
                );

                if (!response.ok) throw new Error(`API returned ${response.status}`);

                const data = await response.json();

                if (!data.data || data.data.length === 0) {
                    throw new Error(`No anime found matching "${title}"`);
                }

                const animeItem = data.data[0];
                const kitsuId = animeItem.id;

                showStatus('📡 Fetching mappings...', 'loading');

                // Now fetch mappings for this anime to find MAL ID
                const mappingsResponse = await fetch(
                    `${KITSU_BASE}/mappings?filter[item]=${kitsuId}&filter[externalSite]=myanimelist/anime`,
                    { headers: { 'Accept': 'application/vnd.api+json' } }
                );

                let malId = null;

                if (mappingsResponse.ok) {
                    const mappingsData = await mappingsResponse.json();
                    if (mappingsData.data && mappingsData.data.length > 0) {
                        malId = Number(mappingsData.data[0].attributes.externalId);
                    }
                }

                populateIds(malId, animeItem);
            } catch (error) {
                showStatus(`❌ ${error.message}`, 'error');
            }
        }

        function populateIds(malId, animeItem) {
            const title = animeItem.attributes.canonicalTitle || 'Unknown';
            const slug = animeItem.attributes.slug || title.toLowerCase().replace(/[^a-z0-9]+/g, '-');
            const kitsuId = animeItem.id;

            resolvedIds = {
                mal: malId,
                anikoto: slug,
                kitsu: kitsuId,
                title: title
            };

            displayIds();
            generatePlayers();

            showStatus(`✅ Found: "${title}"`, 'success');
            setTimeout(() => hideStatus(), 3000);
        }

        function displayIds() {
            const display = document.getElementById('idDisplay');
            
            const cards = [
                { label: 'Anime Title', value: resolvedIds.title },
                { label: 'Kitsu ID', value: resolvedIds.kitsu },
                { label: 'AniKoto ID', value: resolvedIds.anikoto }
            ];

            if (resolvedIds.mal) {
                cards.push({ label: 'MAL ID', value: resolvedIds.mal });
            }

            display.innerHTML = cards.map(card => `
                <div class="id-card">
                    <div class="id-card-label">${card.label}</div>
                    <div class="id-card-value">${card.value}</div>
                </div>
            `).join('');
        }

        function generatePlayers() {
            const section = document.getElementById('playersSection');

            const players = [];

            // Only add S-2 and S-5 if we have anikoto ID
            if (resolvedIds.anikoto) {
                players.push({
                    name: 'MegaPlay S-2',
                    url: `https://megaplay.buzz/stream/s-2/${resolvedIds.anikoto}/sub?ep=1`,
                    badge: 'Server 2'
                });

                players.push({
                    name: 'MegaPlay S-5',
                    url: `https://megaplay.buzz/stream/s-5/${resolvedIds.anikoto}/sub?ep=1`,
                    badge: 'Server 5'
                });
            }

            // Add MAL direct player if we have MAL ID
            if (resolvedIds.mal) {
                players.push({
                    name: 'MegaPlay Direct',
                    url: `https://megaplay.buzz/stream/mal/${resolvedIds.mal}/1/sub`,
                    badge: 'MAL Direct'
                });
            }

            if (players.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.innerHTML = players.map(player => `
                <div class="player-container">
                    <div class="player-header">
                        <span class="player-name">${player.name}</span>
                        <span class="player-badge">${player.badge}</span>
                    </div>
                    <iframe 
                        class="player-frame"
                        src="${player.url}"
                        referrerpolicy="origin"
                        allowfullscreen
                        allow="autoplay; encrypted-media"
                    ></iframe>
                    <div class="player-url">
                        <div class="url-label">Player URL</div>
                        <div class="url-text">${player.url}</div>
                        <button class="copy-btn" onclick="copyToClipboard('${player.url.replace(/'/g, "\\'")}')">📋 Copy</button>
                    </div>
                </div>
            `).join('');

            section.style.display = 'grid';
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showStatus('✅ Copied to clipboard!', 'success');
                setTimeout(() => hideStatus(), 2000);
            }).catch(() => {
                showStatus('❌ Failed to copy', 'error');
            });
        }

        // Allow Enter key
        document.getElementById('malIdOrTitle').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') resolve();
        });
    </script>
</body>
</html>
