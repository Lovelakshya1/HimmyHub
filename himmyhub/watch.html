<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anikoto Stream Tester</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        :root {
            --bg: #0a0a0f;
            --card: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.08);
            --accent: #6366f1;
            --accent-glow: rgba(99,102,241,0.25);
            --text: #e2e8f0;
            --muted: rgba(255,255,255,0.45);
        }
        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #818cf8, #6366f1, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .subtitle { color: var(--muted); font-size: 0.8rem; margin-bottom: 24px; }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
            margin-bottom: 20px;
        }
        .field { display: flex; flex-direction: column; gap: 4px; }
        .field label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
        .field input, .field select {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text);
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
            width: 160px;
        }
        .field input:focus, .field select:focus { border-color: var(--accent); }
        .field input::placeholder { color: rgba(255,255,255,0.2); }

        button {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 0 30px var(--accent-glow); }
        .btn-secondary {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { border-color: var(--accent); }

        .log-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 20px;
            font-size: 0.78rem;
            line-height: 1.7;
            color: var(--muted);
            max-height: 160px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
        }
        .log-box .ok { color: #34d399; }
        .log-box .err { color: #f87171; }
        .log-box .info { color: #60a5fa; }

        .urls-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .url-card {
            flex: 1;
            min-width: 280px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 16px;
        }
        .url-card h3 {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent);
            margin-bottom: 8px;
        }
        .url-card code {
            display: block;
            word-break: break-all;
            font-size: 0.75rem;
            color: var(--text);
            background: rgba(0,0,0,0.3);
            padding: 8px 10px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .players-row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .player-box {
            flex: 1;
            min-width: 340px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }
        .player-box .player-label {
            padding: 10px 16px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .player-box .player-label .pill {
            background: var(--accent);
            color: #fff;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.65rem;
        }
        .player-box iframe {
            width: 100%;
            aspect-ratio: 16/9;
            border: none;
            display: block;
            background: #000;
        }

        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }
        .status-dot.pending { background: #fbbf24; }
        .status-dot.active { background: #34d399; }
        .status-dot.error { background: #f87171; }
    </style>
</head>
<body>

<h1>🎬 Anikoto Stream Tester</h1>
<p class="subtitle">Test s-2 and s-5 MegaPlay embed routes with correct referrer policy</p>

<div class="controls">
    <div class="field">
        <label>MAL ID</label>
        <input type="number" id="malId" placeholder="e.g. 5114" value="5114" />
    </div>
    <div class="field">
        <label>Anikoto Anime ID</label>
        <input type="number" id="animeId" placeholder="e.g. 69" />
    </div>
    <div class="field">
        <label>Episode</label>
        <input type="number" id="epNum" placeholder="1" value="1" />
    </div>
    <div class="field">
        <label>Language</label>
        <select id="lang">
            <option value="sub" selected>SUB</option>
            <option value="dub">DUB</option>
        </select>
    </div>
    <button class="btn-secondary" onclick="resolveFromMalSync()">🔍 Resolve via MAL-Sync</button>
    <button class="btn-primary" onclick="loadPlayers()">▶ Load Players</button>
</div>

<div class="log-box" id="logBox">Ready. Enter a MAL ID and click "Resolve via MAL-Sync" or enter an Anikoto Anime ID directly.</div>

<div class="urls-row" id="urlsRow" style="display:none;">
    <div class="url-card">
        <h3>📚 s-2 URL</h3>
        <code id="s2Url">—</code>
        <button class="btn-secondary" onclick="copyUrl('s2Url')" style="font-size:0.7rem;padding:5px 12px;">Copy</button>
    </div>
    <div class="url-card">
        <h3>⚡ s-5 URL</h3>
        <code id="s5Url">—</code>
        <button class="btn-secondary" onclick="copyUrl('s5Url')" style="font-size:0.7rem;padding:5px 12px;">Copy</button>
    </div>
    <div class="url-card">
        <h3>🎬 MAL Route (Default)</h3>
        <code id="malUrl">—</code>
        <button class="btn-secondary" onclick="copyUrl('malUrl')" style="font-size:0.7rem;padding:5px 12px;">Copy</button>
    </div>
</div>

<div class="players-row" id="playersRow" style="display:none;">
    <div class="player-box">
        <div class="player-label">
            <span class="status-dot pending" id="s2Dot"></span>
            📚 s-2 Player <span class="pill">AniKoto</span>
        </div>
        <iframe id="s2Frame" referrerpolicy="origin" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
    </div>
    <div class="player-box">
        <div class="player-label">
            <span class="status-dot pending" id="s5Dot"></span>
            ⚡ s-5 Player <span class="pill">AniKoto</span>
        </div>
        <iframe id="s5Frame" referrerpolicy="origin" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
    </div>
</div>

<script>
    const logBox = document.getElementById('logBox');

    function log(msg, type = '') {
        const span = document.createElement('div');
        span.className = type;
        span.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logBox.appendChild(span);
        logBox.scrollTop = logBox.scrollHeight;
    }

    async function resolveFromMalSync() {
        const malId = document.getElementById('malId').value.trim();
        if (!malId) { log('Enter a MAL ID first', 'err'); return; }

        log(`Querying MAL-Sync GitHub Backup for MAL ID ${malId}...`, 'info');

        try {
            const res = await fetch(`https://raw.githubusercontent.com/MALSync/MAL-Sync-Backup/master/data/myAnimeList/anime/${malId}.json`);
            if (!res.ok) { log(`MAL-Sync Backup returned ${res.status}`, 'err'); return; }

            const data = await res.json();
            log(`Title: ${data.title || 'Unknown'}`, 'ok');

            const sites = data.Sites || {};

            // Check Anikoto
            let slug = null;
            if (sites.Anikoto) {
                const key = Object.keys(sites.Anikoto)[0];
                if (key) {
                    const entry = sites.Anikoto[key];
                    slug = entry.identifier || key;
                    log(`Anikoto slug: ${slug}`, 'ok');
                }
            }

            // Fallback to Zoro/HiAnime
            if (!slug && sites.Zoro) {
                const key = Object.keys(sites.Zoro)[0];
                if (key) {
                    const entry = sites.Zoro[key];
                    const zoroId = entry.identifier || key;
                    slug = zoroId.replace(/-\d+$/, '');
                    log(`Zoro slug: ${zoroId} → stripped: ${slug}`, 'ok');
                }
            }

            if (!slug) { log('No Anikoto or Zoro mapping found in MAL-Sync', 'err'); return; }

            // Now fetch the watch page to get data-id
            log(`Fetching watch page: anikoto.net/watch/${slug}`, 'info');
            try {
                const watchRes = await fetch(`https://anikoto.net/watch/${slug}`, {
                    headers: { 'Referer': 'https://anikoto.net/' },
                    referrerPolicy: 'origin'
                });

                if (watchRes.ok) {
                    const html = await watchRes.text();
                    const match = html.match(/id\s*=\s*"watch-main"[^>]*\bdata-id\s*=\s*"(\d+)"/);
                    const match2 = html.match(/data-id\s*=\s*"(\d+)"[^>]*id\s*=\s*"watch-main"/);
                    const match3 = html.match(/manga_id["\s:=]+(\d+)/);

                    const animeId = match?.[1] || match2?.[1] || match3?.[1];
                    if (animeId) {
                        document.getElementById('animeId').value = animeId;
                        log(`✅ Resolved Anikoto anime ID: ${animeId}`, 'ok');
                    } else {
                        log('Watch page loaded but data-id not found in HTML', 'err');
                        log('You may need to enter the Anikoto anime ID manually', 'info');
                    }
                } else {
                    log(`Watch page returned ${watchRes.status} (CORS/blocked) — enter anime ID manually`, 'err');
                }
            } catch (e) {
                log(`Watch page fetch failed (CORS expected): ${e.message}`, 'err');
                log('Enter the Anikoto anime ID manually from your browser DevTools', 'info');
            }

        } catch (e) {
            log(`MAL-Sync error: ${e.message}`, 'err');
        }
    }

    function loadPlayers() {
        const animeId = document.getElementById('animeId').value.trim();
        const malId = document.getElementById('malId').value.trim();
        const ep = document.getElementById('epNum').value.trim() || '1';
        const lang = document.getElementById('lang').value;

        if (!animeId) {
            log('Enter an Anikoto Anime ID first (resolve via MAL-Sync or enter manually)', 'err');
            return;
        }

        const s2 = `https://megaplay.buzz/stream/s-2/${animeId}/${lang}?ep=${ep}`;
        const s5 = `https://megaplay.buzz/stream/s-5/${animeId}/${lang}?ep=${ep}`;
        const mal = malId ? `https://megaplay.buzz/stream/mal/${malId}/${ep}/${lang}` : '—';

        document.getElementById('s2Url').textContent = s2;
        document.getElementById('s5Url').textContent = s5;
        document.getElementById('malUrl').textContent = mal;
        document.getElementById('urlsRow').style.display = 'flex';

        document.getElementById('s2Frame').src = s2;
        document.getElementById('s5Frame').src = s5;
        document.getElementById('playersRow').style.display = 'flex';

        document.getElementById('s2Dot').className = 'status-dot active';
        document.getElementById('s5Dot').className = 'status-dot active';

        log(`Loaded s-2: ${s2}`, 'ok');
        log(`Loaded s-5: ${s5}`, 'ok');
        log(`referrerPolicy="origin" → referrer will be: ${window.location.origin}`, 'info');
    }

    function copyUrl(id) {
        const text = document.getElementById(id).textContent;
        navigator.clipboard.writeText(text).then(() => log('Copied to clipboard', 'ok'));
    }
</script>

</body>
</html>
