<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniKoto Watch - ID Resolver</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1410 100%);
            color: #e8dcc8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid #b8860b;
            padding-bottom: 20px;
        }

        h1 {
            font-size: 2.5em;
            color: #ffd700;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #a0826d;
            font-size: 0.9em;
            font-style: italic;
        }

        /* Input Section */
        .input-section {
            background: rgba(30, 20, 15, 0.8);
            border: 2px solid #b8860b;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 40px;
            backdrop-filter: blur(10px);
        }

        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
        }

        label {
            color: #ffd700;
            font-weight: 600;
            min-width: 100px;
        }

        input[type="number"] {
            flex: 1;
            padding: 12px 16px;
            background: rgba(10, 10, 10, 0.9);
            border: 2px solid #8b6914;
            border-radius: 4px;
            color: #e8dcc8;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #b8860b, #ffd700);
            color: #1a1410;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1em;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Status Messages */
        .status {
            padding: 12px 16px;
            border-radius: 4px;
            margin-top: 15px;
            font-size: 0.95em;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status.loading {
            background: rgba(184, 134, 11, 0.2);
            color: #ffd700;
            border-left: 4px solid #ffd700;
        }

        .status.success {
            background: rgba(34, 139, 34, 0.2);
            color: #90ee90;
            border-left: 4px solid #90ee90;
        }

        .status.error {
            background: rgba(220, 20, 60, 0.2);
            color: #ff6b6b;
            border-left: 4px solid #ff6b6b;
        }

        .id-display {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .id-card {
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid #8b6914;
            border-radius: 4px;
            padding: 15px;
            text-align: center;
        }

        .id-card-label {
            color: #a0826d;
            font-size: 0.85em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .id-card-value {
            color: #ffd700;
            font-size: 1.8em;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }

        /* Players Section */
        .players-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .player-container {
            background: rgba(30, 20, 15, 0.9);
            border: 2px solid #b8860b;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .player-container:hover {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
        }

        .player-header {
            background: linear-gradient(90deg, #1a1410, #2a1f15);
            border-bottom: 2px solid #b8860b;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-name {
            color: #ffd700;
            font-weight: 600;
            font-size: 1.1em;
        }

        .player-badge {
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 600;
            text-transform: uppercase;
        }

        .player-frame {
            width: 100%;
            height: 500px;
            background: #000;
            border: none;
        }

        .player-url {
            padding: 15px;
            background: rgba(10, 10, 10, 0.8);
            border-top: 1px solid #8b6914;
        }

        .url-label {
            color: #a0826d;
            font-size: 0.8em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .url-text {
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #8b6914;
            padding: 10px 12px;
            border-radius: 4px;
            color: #e8dcc8;
            font-size: 0.85em;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            overflow-x: auto;
        }

        .copy-btn {
            padding: 8px 16px;
            background: rgba(184, 134, 11, 0.3);
            color: #ffd700;
            border: 1px solid #b8860b;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: rgba(184, 134, 11, 0.5);
        }

        .disabled-state {
            opacity: 0.5;
            pointer-events: none;
        }

        .error-box {
            background: rgba(220, 20, 60, 0.15);
            border: 2px solid #ff6b6b;
            border-radius: 8px;
            padding: 20px;
            color: #ff6b6b;
            margin-top: 20px;
            display: none;
        }

        .error-box.show {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .input-group {
                flex-direction: column;
            }

            label {
                min-width: unset;
            }

            .players-section {
                grid-template-columns: 1fr;
            }

            .player-frame {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 AniKoto Watch</h1>
            <p class="subtitle">MAL ID → AniKoto Internal ID Resolver</p>
        </header>

        <div class="input-section">
            <div class="input-group">
                <label for="malId">MAL ID:</label>
                <input 
                    type="number" 
                    id="malId" 
                    placeholder="e.g., 50265 (Chainsaw Man)"
                    min="1"
                >
                <button id="resolveBtn" onclick="resolveMalId()">Resolve ID</button>
            </div>
            <div class="status" id="status"></div>
            <div class="id-display" id="idDisplay"></div>
            <div class="error-box" id="errorBox"></div>
        </div>

        <div class="players-section" id="playersSection">
            <!-- Players will be populated here -->
        </div>
    </div>

    <script>
        // Kitsu API integration
        const KITSU_BASE = 'https://kitsu.app/api/edge';
        let resolvedIds = {
            mal: null,
            anikoto: null,
            title: null
        };

        function showStatus(message, type = 'loading') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status show ${type}`;
            if (type !== 'loading') {
                setTimeout(() => status.classList.remove('show'), 5000);
            }
        }

        function showError(message) {
            const errorBox = document.getElementById('errorBox');
            errorBox.textContent = message;
            errorBox.classList.add('show');
        }

        function clearError() {
            document.getElementById('errorBox').classList.remove('show');
        }

        async function resolveMalId() {
            const malIdInput = document.getElementById('malId').value;
            
            if (!malIdInput || malIdInput < 1) {
                showError('Please enter a valid MAL ID');
                return;
            }

            clearError();
            showStatus('🔍 Resolving MAL ID via Kitsu...', 'loading');
            
            const btn = document.getElementById('resolveBtn');
            btn.disabled = true;

            try {
                // Query Kitsu mappings with MAL ID
                const response = await fetch(
                    `${KITSU_BASE}/mappings?filter[externalSite]=myanimelist/anime&filter[externalId]=${malIdInput}&include=item&fields[item]=id,slug,titles,canonicalTitle`,
                    {
                        headers: { 'Accept': 'application/vnd.api+json' }
                    }
                );

                if (!response.ok) throw new Error('Kitsu API error');

                const data = await response.json();

                if (!data.data || data.data.length === 0) {
                    throw new Error(`No mapping found for MAL ID ${malIdInput}`);
                }

                // Extract anime item from included
                const animeItem = data.included?.find(i => i.type === 'anime');
                if (!animeItem) throw new Error('No anime data found');

                const title = animeItem.attributes.canonicalTitle;
                const kitsuId = animeItem.id;
                
                // For AniKoto, we'll use the slug as internal ID
                // or derive it from title if not available
                let anikotoId = animeItem.attributes.slug || 
                               title.toLowerCase().replace(/[^a-z0-9]+/g, '-');

                resolvedIds = {
                    mal: Number(malIdInput),
                    anikoto: anikotoId,
                    kitsu: kitsuId,
                    title: title
                };

                displayIds();
                generatePlayers();
                
                showStatus(`✅ Resolved: "${title}"`, 'success');
            } catch (error) {
                console.error('Resolution error:', error);
                showError(`Failed to resolve: ${error.message}`);
            } finally {
                btn.disabled = false;
            }
        }

        function displayIds() {
            const display = document.getElementById('idDisplay');
            display.innerHTML = `
                <div class="id-card">
                    <div class="id-card-label">MAL ID</div>
                    <div class="id-card-value">${resolvedIds.mal}</div>
                </div>
                <div class="id-card">
                    <div class="id-card-label">AniKoto ID</div>
                    <div class="id-card-value">${resolvedIds.anikoto}</div>
                </div>
                <div class="id-card">
                    <div class="id-card-label">Kitsu ID</div>
                    <div class="id-card-value">${resolvedIds.kitsu}</div>
                </div>
                <div class="id-card">
                    <div class="id-card-label">Title</div>
                    <div class="id-card-value" style="font-size: 1.2em;">${resolvedIds.title}</div>
                </div>
            `;
        }

        function generatePlayers() {
            const section = document.getElementById('playersSection');
            
            // Player configurations
            const players = [
                {
                    name: 'MegaPlay S-2',
                    url: `https://megaplay.buzz/stream/s-2/${resolvedIds.anikoto}/sub?ep=1`,
                    badge: 'Server 2'
                },
                {
                    name: 'MegaPlay S-5',
                    url: `https://megaplay.buzz/stream/s-5/${resolvedIds.anikoto}/sub?ep=1`,
                    badge: 'Server 5'
                },
                {
                    name: 'MegaPlay Default',
                    url: `https://megaplay.buzz/stream/mal/${resolvedIds.mal}/1/sub`,
                    badge: 'MAL Direct'
                }
            ];

            section.innerHTML = players.map((player, idx) => `
                <div class="player-container">
                    <div class="player-header">
                        <span class="player-name">${player.name}</span>
                        <span class="player-badge">${player.badge}</span>
                    </div>
                    <iframe 
                        class="player-frame"
                        src="${player.url}"
                        referrerpolicy="origin"
                        allowfullscreen
                        allow="autoplay; encrypted-media"
                    ></iframe>
                    <div class="player-url">
                        <div class="url-label">Player URL</div>
                        <div class="url-text">${player.url}</div>
                        <button class="copy-btn" onclick="copyToClipboard('${player.url}')">📋 Copy URL</button>
                    </div>
                </div>
            `).join('');
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showStatus('✅ URL copied to clipboard!', 'success');
            }).catch(err => {
                showError('Failed to copy URL');
            });
        }

        // Allow Enter key to resolve
        document.getElementById('malId').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') resolveMalId();
        });

        // Disable players section initially
        document.getElementById('playersSection').classList.add('disabled-state');
    </script>
</body>
</html>
