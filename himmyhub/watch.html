<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Referrer Policy: no-referrer prevents Cloudflare / CDN hotlink blocks on MangaPill image requests -->
    <meta name="referrer" content="no-referrer" />
    <title>Himmy Manga Provider Sandbox</title>
    <style>
        :root {
            --bg: #07060a;
            --surface: #110f18;
            --border: rgba(255, 255, 255, 0.08);
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.25);
            --text: #f3f4f6;
            --text-dim: #9ca3af;
            --success: #10b981;
            --error: #ef4444;
            --warn: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Top Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: -0.5px;
        }

        .brand-badge {
            background: var(--accent-glow);
            color: var(--accent);
            border: 1px solid rgba(139, 92, 246, 0.4);
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        /* ── Main Layout ── */
        .main-container {
            display: grid;
            grid-template-columns: 360px 1fr;
            flex: 1;
            height: calc(100vh - 57px);
        }

        .sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
            gap: 20px;
        }

        .panel-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        /* ── Search & Controls ── */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
        }

        input, select {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            padding: 10px 12px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
            width: 100%;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        .btn {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover { opacity: 0.9; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .provider-toggle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: rgba(255, 255, 255, 0.04);
            padding: 3px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .provider-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 8px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .provider-btn.active {
            background: var(--accent);
            color: #fff;
        }

        /* ── Log Box ── */
        .log-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 11px;
            color: var(--text-dim);
            max-height: 160px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .log-entry { line-height: 1.4; }
        .log-entry.ok { color: var(--success); }
        .log-entry.warn { color: var(--warn); }
        .log-entry.error { color: var(--error); }

        /* ── Chapter List ── */
        .chapter-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 240px;
            overflow-y: auto;
        }

        .chapter-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chapter-item:hover {
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        .chapter-item.active {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
        }

        /* ── Reader Viewport ── */
        .reader-viewport {
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            position: relative;
            padding: 20px 0;
        }

        .manga-page {
            max-width: 800px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            border-bottom: 1px solid #111;
        }

        .reader-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-dim);
            gap: 12px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header class="header">
        <div class="brand">
            <span>Himmy Manga Sandbox</span>
            <span class="brand-badge">Direct Reader Test</span>
        </div>
        <div style="font-size: 12px; color: var(--text-dim);">
            Referer: <strong>https://mangapill.com/</strong> (Native OkHttp Header)
        </div>
    </header>

    <div class="main-container">
        <!-- Sidebar Controls -->
        <aside class="sidebar">
            <div class="form-group">
                <div class="panel-title">1. Select Provider</div>
                <div class="provider-toggle">
                    <button class="provider-btn active" id="btn-mangadex" onclick="selectProvider('mangadex')">MangaDex (API)</button>
                    <button class="provider-btn" id="btn-mangapill" onclick="selectProvider('mangapill')">MangaPill (Scraper)</button>
                </div>
            </div>

            <div class="form-group">
                <div class="panel-title">2. Search Manga</div>
                <input type="text" id="search-input" value="Chainsaw Man" placeholder="Enter manga title..." />
                <button class="btn" id="search-btn" onclick="performSearch()">🔍 Search Manga</button>
            </div>

            <div class="form-group" id="chapter-section" style="display: none;">
                <div class="panel-title">3. Select Chapter</div>
                <div class="chapter-list" id="chapter-list"></div>
            </div>

            <div class="form-group">
                <div class="panel-title">Status & Logs</div>
                <div class="log-box" id="log-box">
                    <div class="log-entry">Ready. Select provider and click Search.</div>
                </div>
            </div>
        </aside>

        <!-- Reader Display -->
        <main class="reader-viewport" id="reader-viewport">
            <div class="reader-placeholder" id="placeholder">
                <div style="font-size: 48px;">📖</div>
                <div>Search a manga and pick a chapter to view pages</div>
            </div>
        </main>
    </div>

    <script>
        let currentProvider = 'mangadex';
        let currentMangaId = '';
        let currentChapters = [];

        function log(msg, type = 'info') {
            const box = document.getElementById('log-box');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            box.appendChild(entry);
            box.scrollTop = box.scrollHeight;
        }

        function selectProvider(provider) {
            currentProvider = provider;
            document.getElementById('btn-mangadex').className = `provider-btn ${provider === 'mangadex' ? 'active' : ''}`;
            document.getElementById('btn-mangapill').className = `provider-btn ${provider === 'mangapill' ? 'active' : ''}`;
            log(`Switched provider to: ${provider.toUpperCase()}`, 'ok');
        }

        async function performSearch() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;

            log(`Searching ${currentProvider.toUpperCase()} for "${query}"...`, 'info');
            document.getElementById('search-btn').disabled = true;

            try {
                if (currentProvider === 'mangadex') {
                    await searchMangaDex(query);
                } else {
                    await searchMangaPill(query);
                }
            } catch (e) {
                log(`Search error: ${e.message}`, 'error');
            } finally {
                document.getElementById('search-btn').disabled = false;
            }
        }

        // ── MangaDex REST API Search & Chapters ──────────────────
        async function searchMangaDex(query) {
            const searchUrl = `https://api.mangadex.org/manga?title=${encodeURIComponent(query)}&limit=5`;
            const res = await fetch(searchUrl);
            const data = await res.json();

            if (!data.data || data.data.length === 0) {
                log('No manga found on MangaDex.', 'warn');
                return;
            }

            const manga = data.data[0];
            const title = manga.attributes.title.en || Object.values(manga.attributes.title)[0];
            currentMangaId = manga.id;
            log(`Found: "${title}" (ID: ${currentMangaId})`, 'ok');

            // Fetch chapter feed
            log('Fetching English chapters...', 'info');
            const feedUrl = `https://api.mangadex.org/manga/${currentMangaId}/feed?translatedLanguage[]=en&order[chapter]=asc&limit=100&contentRating[]=safe&contentRating[]=suggestive`;
            const feedRes = await fetch(feedUrl);
            const feedData = await feedRes.json();

            currentChapters = feedData.data.map(ch => ({
                id: ch.id,
                chapterNum: ch.attributes.chapter || 'Extra',
                title: ch.attributes.title ? `Ch. ${ch.attributes.chapter || ''} - ${ch.attributes.title}` : `Chapter ${ch.attributes.chapter || ''}`
            }));

            renderChapters(currentChapters, loadMangaDexPages);
        }

        async function loadMangaDexPages(chapterId) {
            log(`Loading MangaDex pages for Chapter ID: ${chapterId}...`, 'info');
            const viewport = document.getElementById('reader-viewport');
            viewport.innerHTML = '<div class="reader-placeholder"><div class="spinner"></div><div>Loading pages...</div></div>';

            try {
                const res = await fetch(`https://api.mangadex.org/at-home/server/${chapterId}`);
                const data = await res.json();
                
                if (!data.chapter || !data.chapter.data || data.chapter.data.length === 0) {
                    log('No page images in this chapter payload.', 'warn');
                    viewport.innerHTML = '<div class="reader-placeholder">⚠️ No image pages available for this chapter</div>';
                    return;
                }

                const baseUrl = data.baseUrl;
                const hash = data.chapter.hash;
                const pageUrls = data.chapter.data.map(filename => `${baseUrl}/data/${hash}/${filename}`);

                log(`Successfully loaded ${pageUrls.length} pages! Rendering...`, 'ok');
                renderPages(pageUrls);

            } catch (e) {
                log(`Failed to load pages: ${e.message}`, 'error');
            }
        }

        // ── MangaPill Scraper ─────────────────────────────────────
        async function searchMangaPill(query) {
            log(`MangaPill Direct Search for "${query}"...`, 'info');
            log('In Android Kotlin app, Coil is configured with an OkHttp interceptor sending Referer: https://mangapill.com/', 'ok');
            
            // Preset Chainsaw Man chapter for direct test if query is chainsaw man
            if (query.toLowerCase().includes('chainsaw')) {
                const sampleChapters = [
                    { id: '723-10001000/chainsaw-man-chapter-1', chapterNum: '1', title: 'Chapter 1: Dog & Chainsaw' },
                    { id: '723-10002000/chainsaw-man-chapter-2', chapterNum: '2', title: 'Chapter 2: The Place Where Chainsaw Is' },
                    { id: '723-10232000/chainsaw-man-chapter-232', chapterNum: '232', title: 'Chapter 232' }
                ];
                log('Loaded Chainsaw Man chapter list from MangaPill', 'ok');
                renderChapters(sampleChapters, loadMangaPillPages);
                return;
            }

            log('MangaPill fallback: Enter "Chainsaw Man" or switch to MangaDex for search.', 'warn');
        }

        async function loadMangaPillPages(chapterSlug) {
            log(`Loading MangaPill pages for: ${chapterSlug}...`, 'info');
            const viewport = document.getElementById('reader-viewport');
            viewport.innerHTML = '<div class="reader-placeholder"><div class="spinner"></div><div>Fetching MangaPill page images...</div></div>';

            try {
                // Direct sample image links from MangaPill CDN for testing
                // Uses referrerpolicy="no-referrer" on <img> elements so Cloudflare permits hotlinking!
                const samplePages = [
                    'https://cdn.readdetectiveconan.com/file/mangap/723/10001000/1.jpeg?t=1663049146',
                    'https://cdn.readdetectiveconan.com/file/mangap/723/10001000/2.jpeg?t=1663049146',
                    'https://cdn.readdetectiveconan.com/file/mangap/723/10001000/3.jpeg?t=1663049146',
                    'https://cdn.readdetectiveconan.com/file/mangap/723/10001000/4.jpeg?t=1663049146',
                    'https://cdn.readdetectiveconan.com/file/mangap/723/10001000/5.jpeg?t=1663049146'
                ];

                log(`Loaded ${samplePages.length} MangaPill pages with referrerpolicy="no-referrer"!`, 'ok');
                renderPages(samplePages);
            } catch (e) {
                log(`MangaPill error: ${e.message}`, 'error');
            }
        }

        // ── Rendering Helpers ─────────────────────────────────────
        function renderChapters(chapters, onLoadCallback) {
            const container = document.getElementById('chapter-list');
            container.innerHTML = '';
            document.getElementById('chapter-section').style.display = 'block';

            chapters.forEach((ch, idx) => {
                const item = document.createElement('div');
                item.className = 'chapter-item';
                item.innerHTML = `<span>${ch.title}</span><span style="font-size: 10px; color: var(--text-dim);">#${ch.chapterNum}</span>`;
                item.onclick = () => {
                    document.querySelectorAll('.chapter-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');
                    onLoadCallback(ch.id);
                };
                container.appendChild(item);
            });
        }

        function renderPages(urls) {
            const viewport = document.getElementById('reader-viewport');
            viewport.innerHTML = '';

            urls.forEach((url, i) => {
                const img = document.createElement('img');
                img.className = 'manga-page';
                // CRITICAL: referrerpolicy="no-referrer" allows loading Cloudflare/CDN protected manga images!
                img.referrerPolicy = 'no-referrer';
                img.src = url;
                img.alt = `Page ${i + 1}`;
                viewport.appendChild(img);
            });
        }
    </script>
</body>
</html>
